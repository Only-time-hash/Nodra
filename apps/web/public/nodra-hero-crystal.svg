<g transform="translate(226 303)"><path d="M24 0H269l22 15v62l-22 15H24L0 77V15Z" fill="url(#plate)" stroke="url(#edge)" stroke-width="1.5"/><rect x="24" y="25" width="37" height="37" rx="9" fill="#062751" stroke="#248fff"/><path d="M35 38h16v14H35Z" fill="none" stroke="#58b6ff" stroke-width="2"/><text x="76" y="42" fill="#f5f8ff" font-size="14" font-weight="700">Monitoring &amp; Evidence</text><text x="76" y="59" fill="#8ea4c1" font-size="9">What happened?</text></g>
