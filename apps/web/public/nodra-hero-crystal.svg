<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d">
<title id="t">Nodra security boundary</title><desc id="d">AI Agent requests pass through Identity, Authority, Policy Enforcement and Monitoring and Evidence to Allowed, Requires Approval or Blocked outcomes.</desc>
<defs>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09264e"/><stop offset=".52" stop-color="#0a1d43"/><stop offset="1" stop-color="#151445"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16a9ff"/><stop offset=".55" stop-color="#386dff"/><stop offset="1" stop-color="#8a50ff"/></linearGradient>
 <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf1ff"/><stop offset=".45" stop-color="#45a0ff"/><stop offset="1" stop-color="#7856ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".48"/></filter>
</defs>
