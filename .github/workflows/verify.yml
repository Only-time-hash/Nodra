name: Nodra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and acceptance tests
        run: npm test
      - name: Coverage measurement
        run: npm run test:coverage
      - name: Migration integrity
        run: npm run verify:migrations
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Start isolated local Supabase
        run: npx supabase@latest start
      - name: Apply repository migrations
        run: npx supabase@latest db reset
      - name: Workspace isolation and replay tests
        shell: bash
        run: |
          DB_URL="$(npx supabase@latest status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_workspace_isolation.sql
      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop --no-backup
