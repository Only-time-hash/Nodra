name: Nodra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify committed lockfile is current
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit and acceptance tests
        run: npm test
      - name: Python SDK tests
        run: PYTHONPATH=packages/python-sdk/src python -m unittest discover -s packages/python-sdk/tests -p "test_*.py"
      - name: Build Python SDK wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build packages/python-sdk
      - name: Verify Python SDK installs outside the source tree
        run: |
          python -m venv /tmp/nodra-python-sdk-check
          /tmp/nodra-python-sdk-check/bin/python -m pip install packages/python-sdk/dist/*.whl
          cd /tmp
          /tmp/nodra-python-sdk-check/bin/python -c "from nodra import Nodra, NodraError; print(Nodra.__name__, NodraError.__name__)"
      - name: Coverage measurement
        run: npm run test:coverage
      - name: Migration integrity
        run: npm run verify:migrations
      - name: TypeScript
        run: npm run typecheck
      - name: Build public JavaScript SDK
        run: npm run build:sdk
      - name: Verify JavaScript SDK publish bundle
        run: npm run pack:sdk
      - name: Verify JavaScript SDK installs outside the monorepo
        run: |
          cd packages/sdk
          npm pack --json > /tmp/nodra-sdk-pack.json
          TARBALL="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/nodra-sdk-pack.json','utf8'));process.stdout.write(x[0].filename)")"
          mkdir -p /tmp/nodra-js-sdk-check
          cd /tmp/nodra-js-sdk-check
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/packages/sdk/$TARBALL"
          node --input-type=module -e "import {Nodra,NodraError} from 'nodra-agent-sdk'; console.log(Nodra.name,NodraError.name)"
      - name: Validate OpenAPI v1 contract
        run: npx --yes @redocly/cli@2.12.6 lint docs/openapi.yaml
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Start isolated local Supabase database
        run: npx supabase@latest db start
      - name: Apply repository migrations
        run: npx supabase@latest db reset
      - name: Database lint
        run: npx supabase@latest db lint --level error
      - name: Workspace isolation and replay tests
        shell: bash
        run: |
          DB_URL="$(npx supabase@latest status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_workspace_isolation.sql
      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop --no-backup
