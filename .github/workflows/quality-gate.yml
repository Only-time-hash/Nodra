name: Nodra Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations
      - run: python -m unittest discover -s packages/python-sdk/tests -p "test_*.py"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
